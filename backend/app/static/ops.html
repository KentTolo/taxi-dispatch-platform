<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Live operations</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    --bg: #fff; --bg-2: #f4f4f5; --bg-3: #e9e9eb;
    --ink: #0a0a0a; --ink-2: #545458; --ink-3: #8e8e93; --line: rgba(60,60,67,.12);
    --glass: rgba(255,255,255,.82); --glass-line: rgba(255,255,255,.7);
    --primary: #0a0a0a; --on-primary: #fff;
    --online: #1f9d55; --online-soft: rgba(31,157,85,.14);
    --break: #c27c0e; --break-soft: rgba(194,124,14,.16);
    --danger: #d92d20; --danger-soft: rgba(217,45,32,.1);
    --me: #2f6bff;
    --shadow: 0 10px 40px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);
    --ease: cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --bg-2: #1c1c1e; --bg-3: #2c2c2e;
      --ink: #f5f5f7; --ink-2: #aeaeb2; --ink-3: #8e8e93; --line: rgba(84,84,88,.45);
      --glass: rgba(28,28,30,.78); --glass-line: rgba(255,255,255,.08);
      --primary: #f5f5f7; --on-primary: #000;
      --online: #30d158; --online-soft: rgba(48,209,88,.18);
      --break: #ffb340; --break-soft: rgba(255,179,64,.18);
      --danger: #ff453a; --danger-soft: rgba(255,69,58,.16);
      --shadow: 0 10px 40px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 var(--font); letter-spacing: -.01em; color: var(--ink); background: var(--bg-3); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 3px solid var(--me); outline-offset: 2px; border-radius: 10px; }

  #map { position: fixed; inset: 0; }
  .leaflet-container { background: var(--bg-3); font-family: var(--font); }
  .leaflet-control-attribution { background: var(--glass) !important; color: var(--ink-3); border-radius: 6px 0 0 0; backdrop-filter: blur(8px); }
  .leaflet-control-attribution a { color: var(--ink-2); }
  .leaflet-control-zoom { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 14px !important; overflow: hidden; }
  .leaflet-control-zoom a { background: var(--glass) !important; color: var(--ink) !important; backdrop-filter: blur(20px); border-color: var(--line) !important; width: 40px !important; height: 40px !important; line-height: 40px !important; }

  .glass { background: var(--glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }

  .panel {
    position: fixed; z-index: 1000; top: 16px; left: 16px; bottom: 16px; width: 360px;
    border-radius: 26px; display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head { padding: 20px 20px 12px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font: 700 24px var(--display); letter-spacing: -.025em; margin: 0; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--online); }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: ping 2s infinite; }
  .live.stale { color: var(--ink-3); } .live.stale::before { animation: none; }
  .sub { color: var(--ink-2); margin: 2px 0 14px; font-size: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .kpi { background: var(--bg); border-radius: 14px; padding: 10px 10px 8px; text-align: left; transition: transform .15s var(--ease), box-shadow .2s; }
  .kpi:active { transform: scale(.97); }
  .kpi.active { box-shadow: inset 0 0 0 2px var(--ink); }
  .kpi b { display: block; font: 700 22px var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .kpi i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }

  .search { margin: 12px 0 0; position: relative; display: block; }
  .search input { width: 100%; height: 42px; padding: 0 14px 0 38px; border-radius: 12px; border: 0; background: var(--bg-3); outline: none; }
  .search svg { position: absolute; left: 12px; top: 12px; color: var(--ink-3); }

  .list { flex: 1; overflow: auto; padding: 4px 12px 12px; }
  .driver { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px; border-radius: 16px; transition: background .15s; }
  .driver:hover { background: var(--bg-2); }
  .driver.selected { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .av { position: relative; width: 42px; height: 42px; border-radius: 50%; background: var(--bg-3); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
  .av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--bg); background: var(--c, var(--ink-3)); }
  .driver .meta { flex: 1; min-width: 0; }
  .driver .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .driver .line { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.available { background: var(--online-soft); color: var(--online); }
  .tag.on_break { background: var(--break-soft); color: var(--break); }
  .tag.lost { background: var(--danger-soft); color: var(--danger); }
  .empty { text-align: center; color: var(--ink-3); padding: 40px 20px; }
  .panel-foot { padding: 10px 20px 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); }
  .link { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

  .nearest {
    position: fixed; z-index: 1000; right: 16px; bottom: 28px; width: 340px; border-radius: 22px; padding: 16px;
    transform: translateY(20px); opacity: 0; pointer-events: none; transition: transform .4s var(--ease), opacity .25s;
  }
  .nearest.show { transform: none; opacity: 1; pointer-events: auto; }
  .nearest h2 { font: 700 17px var(--display); margin: 0 0 2px; }
  .nearest .sub { margin-bottom: 10px; }
  .rank { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .rank:first-of-type { border-top: 0; }
  .rank .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--bg-3); }
  .rank:first-of-type .n { background: var(--primary); color: var(--on-primary); }
  .rank .who { flex: 1; font-weight: 600; }
  .rank .km { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; background: var(--bg-3); display: grid; place-items: center; color: var(--ink-2); }

  .car { background: none; border: 0; }
  .car-pin {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; font: 700 12px var(--font); color: #fff;
    background: var(--c); border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3);
    transition: transform .2s var(--ease);
  }
  .car-pin.sel { transform: scale(1.25); }
  .car-pin.lost { opacity: .75; }
  .pickup-pin { width: 18px; height: 18px; border-radius: 50%; background: var(--primary); border: 4px solid var(--bg); box-shadow: 0 0 0 2px var(--primary), 0 6px 18px rgba(0,0,0,.35); }
  .route { stroke: var(--primary); stroke-dasharray: 2 8; stroke-linecap: round; stroke-width: 4; fill: none; }

  .gate { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: rgba(0,0,0,.25); backdrop-filter: blur(6px); }
  .gate form { width: min(380px, calc(100% - 32px)); border-radius: 26px; padding: 28px; display: grid; gap: 12px; }
  .gate h2 { font: 700 26px var(--display); letter-spacing: -.025em; margin: 0; }
  .gate p { margin: 0 0 6px; color: var(--ink-2); }
  .gate input { height: 50px; border-radius: 14px; border: 2px solid transparent; background: var(--bg-2); padding: 0 14px; font-size: 16px; outline: none; }
  .gate input:focus { border-color: var(--ink); background: var(--bg); }
  .gate button { height: 52px; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 16px; }
  .gate .err { color: var(--danger); font-size: 14px; min-height: 18px; margin: 0; }
  .hidden { display: none !important; }

  @keyframes ping { 0% { box-shadow: 0 0 0 0 var(--online-soft); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (max-width: 720px) {
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 46vh; }
    .nearest { left: 8px; right: 8px; width: auto; bottom: calc(46vh + 16px); }
  }
</style>
</head>
<body>
<div id="map"></div>

<aside class="panel glass" aria-label="Drivers">
  <div class="panel-head">
    <div class="title-row">
      <h1 id="company-name">Live map</h1>
      <span class="live stale" id="live">Connecting</span>
    </div>
    <p class="sub">Click the map to find the nearest available driver.</p>
    <div class="kpis" id="kpis"></div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search driver or plate" aria-label="Search drivers">
    </label>
  </div>
  <div class="list" id="list"></div>
  <div class="panel-foot"><span id="updated">—</span><button class="link" id="signout">Sign out</button></div>
</aside>

<section class="nearest glass" id="nearest" aria-live="polite"></section>

<div class="gate" id="gate">
  <form class="glass" id="cfg">
    <h2>Operations</h2>
    <p>Sign in to see your fleet live.</p>
    <input id="company" placeholder="Company code" autocomplete="organization" required>
    <input id="key" placeholder="Operator key" type="password" autocomplete="current-password" required>
    <p class="err" id="err"></p>
    <button>Open live map</button>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const initials = (n) => (n || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const ago = (s) => s == null ? "no position yet" : s < 60 ? `${s}s ago` : `${Math.round(s / 60)} min ago`;
const state = (d) => d.signal_lost ? "lost" : d.status;
const colour = (d) => ({ available: css("--online"), on_break: css("--break"), lost: css("--ink-3") }[state(d)] || css("--ink-3"));
const label = { available: "Available", on_break: "On break", lost: "Signal lost" };

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const map = L.map("map", { zoomControl: false }).setView([-29.315, 27.486], 13);
L.control.zoom({ position: "topright" }).addTo(map);
L.tileLayer(dark ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
                 : "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  maxZoom: 19, subdomains: "abcd",
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
}).addTo(map);
map.attributionControl.setPrefix(false);

let cfg = null;
try { cfg = JSON.parse(localStorage.getItem("opsCfg") || "null"); } catch {}
let drivers = [];
let filter = "all";
let selected = null;
let fitted = false;
const markers = new Map();
const nearestLayer = L.layerGroup().addTo(map);

async function api(path) {
  const r = await fetch(path, { headers: { "X-Ops-Key": cfg.key } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.detail || r.statusText), { status: r.status });
  return body;
}

$("cfg").onsubmit = async (e) => {
  e.preventDefault();
  cfg = { company: $("company").value.trim().toLowerCase(), key: $("key").value };
  $("err").textContent = "";
  try {
    await api(`/api/ops/drivers?company=${encodeURIComponent(cfg.company)}`);
    try { localStorage.setItem("opsCfg", JSON.stringify(cfg)); } catch {}
    $("gate").classList.add("hidden");
    fitted = false;
    refresh();
  } catch (err) {
    $("err").textContent = err.status === 401 ? "That operator key isn't right." : err.status === 404 ? "No company with that code." : err.message;
  }
};

function signOut() {
  try { localStorage.removeItem("opsCfg"); } catch {}
  cfg = null;
  $("gate").classList.remove("hidden");
}
$("signout").onclick = signOut;

function renderKpis() {
  const c = { all: drivers.length, available: 0, on_break: 0, lost: 0 };
  drivers.forEach((d) => { if (c[state(d)] != null) c[state(d)]++; });
  const k = (key, text, col) => `<button class="kpi ${filter === key ? "active" : ""}" data-f="${key}"><b>${c[key]}</b><span>${col ? `<i style="background:${col}"></i>` : ""}${text}</span></button>`;
  $("kpis").innerHTML = k("all", "On shift") + k("available", "Free", css("--online")) + k("on_break", "Break", css("--break")) + k("lost", "Lost", css("--danger"));
  $("kpis").querySelectorAll("[data-f]").forEach((b) => b.onclick = () => {
    filter = filter === b.dataset.f ? "all" : b.dataset.f;
    renderAll();
  });
}

function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const rows = drivers
    .filter((d) => filter === "all" || state(d) === filter)
    .filter((d) => !q || d.name.toLowerCase().includes(q) || (d.vehicle || "").toLowerCase().includes(q));
  $("list").innerHTML = rows.length ? rows.map((d) => `
    <button class="driver ${selected === d.id ? "selected" : ""}" data-id="${d.id}">
      <span class="av" style="--c:${colour(d)}">${esc(initials(d.name))}</span>
      <span class="meta"><div class="name">${esc(d.name)}</div>
        <div class="line">${esc(d.vehicle || "No vehicle")} · ${esc(ago(d.position_age_s))}${d.battery != null ? ` · ${d.battery}%` : ""}</div></span>
      <span class="tag ${state(d)}">${label[state(d)] || esc(d.status)}</span>
    </button>`).join("")
    : `<div class="empty">${drivers.length ? "No drivers match." : "No drivers on shift right now."}</div>`;
  $("list").querySelectorAll("[data-id]").forEach((b) => b.onclick = () => focusDriver(Number(b.dataset.id)));
}

function renderMarkers() {
  const seen = new Set();
  for (const d of drivers) {
    if (d.lat == null) continue;
    seen.add(d.id);
    const html = `<div class="car-pin ${d.signal_lost ? "lost" : ""} ${selected === d.id ? "sel" : ""}" style="--c:${colour(d)}">${esc(initials(d.name))}</div>`;
    const icon = L.divIcon({ className: "car", html, iconSize: [36, 36], iconAnchor: [18, 18] });
    let m = markers.get(d.id);
    if (!m) {
      m = L.marker([d.lat, d.lng], { icon, title: d.name }).addTo(map).on("click", () => focusDriver(d.id));
      markers.set(d.id, m);
    } else {
      m.setLatLng([d.lat, d.lng]).setIcon(icon);
    }
    m.setZIndexOffset(selected === d.id ? 1000 : 0);
  }
  for (const [id, m] of markers) if (!seen.has(id)) { m.remove(); markers.delete(id); }
  if (!fitted && markers.size) {
    const wide = innerWidth > 720;
    map.fitBounds(L.featureGroup([...markers.values()]).getBounds(), { maxZoom: 15, paddingTopLeft: wide ? [400, 40] : [40, 40], paddingBottomRight: wide ? [40, 40] : [40, innerHeight * 0.5] });
    fitted = true;
  }
}

function renderAll() { renderKpis(); renderList(); renderMarkers(); }

function focusDriver(id) {
  selected = selected === id ? null : id;
  const d = drivers.find((x) => x.id === id);
  if (selected && d?.lat != null) map.flyTo([d.lat, d.lng], Math.max(map.getZoom(), 15), { duration: 0.6 });
  renderAll();
}

async function refresh() {
  if (!cfg) return;
  try {
    const data = await api(`/api/ops/drivers?company=${encodeURIComponent(cfg.company)}`);
    drivers = data.drivers;
    $("company-name").textContent = cfg.company === "demo" ? "Demo Taxis" : cfg.company;
    $("live").textContent = "Live";
    $("live").classList.remove("stale");
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
    renderAll();
  } catch (err) {
    if (err.status === 401) return signOut();
    $("live").textContent = "Reconnecting";
    $("live").classList.add("stale");
  }
}

map.on("click", async (e) => {
  if (!cfg) return;
  nearestLayer.clearLayers();
  L.marker(e.latlng, { icon: L.divIcon({ className: "car", html: '<div class="pickup-pin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(nearestLayer);
  const box = $("nearest");
  try {
    const r = await api(`/api/ops/drivers/nearest?company=${encodeURIComponent(cfg.company)}&lat=${e.latlng.lat}&lng=${e.latlng.lng}`);
    if (r.drivers[0]) L.polyline([e.latlng, [r.drivers[0].lat, r.drivers[0].lng]], { className: "route" }).addTo(nearestLayer);
    box.innerHTML = `<button class="x" id="nx" aria-label="Close">✕</button>
      <h2>Nearest available</h2><p class="sub">Within ${r.radius_km} km of this point</p>
      ${r.drivers.length
        ? r.drivers.map((d, i) => `<div class="rank"><span class="n">${i + 1}</span><span class="who">${esc(d.name)}</span><span class="km">${d.distance_km} km</span></div>`).join("")
        : `<p class="sub">No available drivers in range.</p>`}`;
    box.classList.add("show");
    $("nx").onclick = () => { box.classList.remove("show"); nearestLayer.clearLayers(); };
  } catch (err) {
    box.innerHTML = `<p class="sub">${esc(err.message)}</p>`;
    box.classList.add("show");
  }
});

$("q").addEventListener("input", renderList);
if (cfg) { $("gate").classList.add("hidden"); $("company").value = cfg.company; refresh(); }
setInterval(refresh, 5000);
</script>
</body>
</html>
