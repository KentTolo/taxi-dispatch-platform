# Render blueprint for the demo server. On Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: taxi-platform-demo
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taxi-platform-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPS_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.8"

databases:
  - name: taxi-platform-db
    plan: free
    region: frankfurt
